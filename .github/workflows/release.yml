name: Build and Release

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        # Restore the project (not only the solution) to avoid ambiguous outputs
        run: dotnet restore Unfriendmaxxing.csproj
        shell: powershell

      - name: Determine version (short commit hash)
        id: version
        shell: powershell
        run: |
          $hash = "${{ github.sha }}".Substring(0, 7)
          echo "version=$hash" >> $env:GITHUB_OUTPUT
          echo "Building version: $hash"

      - name: Publish Windows x64
        shell: powershell
        run: |
          # IMPORTANT: publish the .csproj, not the .sln
          # (solution-level -o triggers NETSDK1194 and mixed outputs)
          dotnet publish Unfriendmaxxing.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=embedded `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:AssemblyName=VRCUFM `
            -p:InformationalVersion=${{ steps.version.outputs.version }} `
            -o ./publish

      - name: Prepare bundle
        shell: powershell
        run: |
          if (Test-Path "icon.ico") { Copy-Item "icon.ico" "./publish/" -Force }
          if (Test-Path "icon.png") { Copy-Item "icon.png" "./publish/" -Force }

          if (-not (Test-Path "./publish/VRCUFM.exe")) {
            Write-Host "Publish directory listing:"
            Get-ChildItem ./publish -Recurse | Select-Object FullName
            throw "publish/VRCUFM.exe missing after publish"
          }

          Get-ChildItem ./publish | Format-Table Name, Length

      - name: Zip + SHA256
        shell: powershell
        run: |
          $zip = "./VRCUFM-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path ./publish/* -DestinationPath $zip

          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Set-Content -Path "./VRCUFM-win-x64.zip.sha256" -Value "$hash  VRCUFM-win-x64.zip" -NoNewline
          Write-Host "SHA256: $hash"

      - name: Create/Update Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            ./VRCUFM-win-x64.zip
            ./VRCUFM-win-x64.zip.sha256
          tag: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            Automated build from commit `${{ github.sha }}`

            **Version:** `${{ steps.version.outputs.version }}`

            **Zip (flat root):**
            - `VRCUFM.exe`
            - Native deps from publish
            - Icons when present

            **Integrity:** `VRCUFM-win-x64.zip.sha256`
          prerelease: false
          allowUpdates: true
          makeLatest: true
          omitBodyDuringUpdate: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

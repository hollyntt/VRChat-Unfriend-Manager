name: Build and Release

permissions:
  contents: write

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Version
        id: bump
        shell: bash
        run: |
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          VERSION=${LATEST_TAG#v}
          VERSION=$(echo "$VERSION" | tr -d '[:space:]')
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION:-0.0.0}"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}

          BUMP="patch"
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"%s")
          else
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")
          fi

          if echo "$COMMITS" | grep -qE "BREAKING CHANGE|^[a-zA-Z0-9_]+(\([a-zA-Z0-9_ -]+\))?!:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE "^feat(\([a-zA-Z0-9_ -]+\))?:"; then
            BUMP="minor"
          fi

          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION (bump: $BUMP, was $LATEST_TAG)"

      - name: Push new tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

  build:
    needs: versioning
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Unfriendmaxxing.csproj

      - name: Publish
        shell: bash
        run: |
          dotnet publish Unfriendmaxxing.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugType=embedded \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishTrimmed=false \
            -p:AssemblyName=VRCUFM \
            -p:Version=${{ needs.versioning.outputs.version }} \
            -p:AssemblyVersion=${{ needs.versioning.outputs.version }}.0 \
            -p:FileVersion=${{ needs.versioning.outputs.version }}.0 \
            -p:InformationalVersion=${{ needs.versioning.outputs.version }} \
            -o ./publish/${{ matrix.rid }}

      - name: Stage icons
        shell: bash
        run: |
          for f in icon.ico icon.png; do
            if [ -f "$f" ]; then cp "$f" "./publish/${{ matrix.rid }}/"; fi
          done
          ls -la "./publish/${{ matrix.rid }}"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.rid }}
          path: ./publish/${{ matrix.rid }}

  appimage:
    needs: [versioning, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: build-linux-x64
          path: ./publish/linux-x64

      - name: Create AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin
          cp -r ./publish/linux-x64/* AppDir/usr/bin/

          if [ -f icon.png ]; then
            cp icon.png AppDir/vrcufm.png
          elif [ -f AppDir/usr/bin/icon.png ]; then
            cp AppDir/usr/bin/icon.png AppDir/vrcufm.png
          else
            printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' | base64 -d > AppDir/vrcufm.png
          fi

          cat > AppDir/vrcufm.desktop << 'EOF'
          [Desktop Entry]
          Name=VRChat Unfriend Manager
          Exec=usr/bin/VRCUFM
          Icon=vrcufm
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF
          sed -i 's/^[[:space:]]*//' AppDir/vrcufm.desktop

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/VRCUFM" "$@"
          EOF
          chmod +x AppDir/AppRun
          chmod +x AppDir/usr/bin/VRCUFM

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir VRCUFM-x86_64.AppImage
          ls -la VRCUFM-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: VRCUFM-x86_64.AppImage

  package:
    needs: [versioning, build, appimage]
    runs-on: ubuntu-latest
    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: ./builds

      - name: Package Windows, Linux, and combined distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p VRCUFM/win-x64 VRCUFM/linux-x64
          cp -a builds/build-win-x64/. VRCUFM/win-x64/
          cp -a builds/build-linux-x64/. VRCUFM/linux-x64/
          cp builds/appimage/VRCUFM-x86_64.AppImage VRCUFM/linux-x64/
          chmod +x VRCUFM/linux-x64/VRCUFM VRCUFM/linux-x64/VRCUFM-x86_64.AppImage

          (cd VRCUFM/win-x64 && zip -r ../../VRCUFM-windows-x64.zip .)
          (cd VRCUFM/linux-x64 && tar -czf ../../VRCUFM-linux-x64.tar.gz .)
          (cd VRCUFM && zip -r ../VRCUFM.zip .)
          ls -lh VRCUFM-windows-x64.zip VRCUFM-linux-x64.tar.gz VRCUFM.zip

      - name: Upload platform packages
        uses: actions/upload-artifact@v4
        with:
          name: VRCUFM-platform-packages
          path: |
            VRCUFM-windows-x64.zip
            VRCUFM-linux-x64.tar.gz
            VRCUFM.zip

  release:
    needs: [versioning, package, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          name: VRCUFM-platform-packages

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: appimage

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            VRCUFM.zip
            VRCUFM-windows-x64.zip
            VRCUFM-linux-x64.tar.gz
            VRCUFM-x86_64.AppImage
          tag: v${{ needs.versioning.outputs.version }}
          name: v${{ needs.versioning.outputs.version }}
          body: |
            **v${{ needs.versioning.outputs.version }}**

            **Windows x64:** download `VRCUFM-windows-x64.zip`, extract it, and run `VRCUFM.exe`.

            **Linux x64:** download `VRCUFM-linux-x64.tar.gz`, extract it, and run `./VRCUFM`.
            Alternatively download `VRCUFM-x86_64.AppImage`, run `chmod +x VRCUFM-x86_64.AppImage`, then launch it.

            **Combined package:** `VRCUFM.zip` contains both Windows and Linux builds plus the AppImage.
          prerelease: false
          makeLatest: true
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

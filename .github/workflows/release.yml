name: Build and Release

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Note: If 10.0.x is too new/unavailable on the runner, change to '8.0.x' or '9.0.x'
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Determine version (short commit hash)
        id: version
        run: |
          $hash = "${{ github.sha }}".Substring(0, 7)
          echo "version=$hash" >> $env:GITHUB_OUTPUT
          echo "Building version: $hash"
        shell: powershell

      - name: Build Windows x64 (Single File)
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=embedded `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:AssemblyName=VRCUFM `
            -p:InformationalVersion=${{ steps.version.outputs.version }} `
            -o ./publish
        shell: powershell

      - name: Create/Update Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ./publish/VRCUFM.exe
          tag: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            Automated build from commit ${{ github.sha }}
            
            **Asset:**
            - `VRCUFM.exe` — Single-file Windows executable
          prerelease: true
          allowUpdates: true
          makeLatest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
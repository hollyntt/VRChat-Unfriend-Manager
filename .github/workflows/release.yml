name: Build and Release

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Using 9.0.x for stability as 10.0 is in early preview
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Determine version (short commit hash)
        id: version
        run: |
          $hash = "${{ github.sha }}".Substring(0, 7)
          echo "version=$hash" >> $env:GITHUB_OUTPUT
          echo "Building version: $hash"
        shell: powershell

      - name: Build Windows x64
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=embedded `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:AssemblyName=VRCUFM `
            -p:InformationalVersion=${{ steps.version.outputs.version }} `
            -o ./publish
        shell: powershell

      - name: Prepare and Zip Bundle
        run: |
          # Copy icons to the publish folder if they exist in the root
          if (Test-Path "icon.ico") { Copy-Item "icon.ico" "./publish/" }
          if (Test-Path "icon.png") { Copy-Item "icon.png" "./publish/" }
          
          # Zip the entire publish directory
          Compress-Archive -Path ./publish/* -DestinationPath ./VRCUFM-win-x64.zip
        shell: powershell

      - name: Create/Update Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ./VRCUFM-win-x64.zip
          tag: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            Automated build from commit ${{ github.sha }}
            
            **Assets included in .zip:**
            - `VRCUFM.exe` (Main Application)
            - `raylib.dll`, `cimgui.dll`, `e_sqlite3.dll` (Native dependencies)
            - `icon.ico`, `icon.png` (App resources)
          prerelease: false
          allowUpdates: true
          makeLatest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}